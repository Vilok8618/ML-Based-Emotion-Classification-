[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-clf"
version = "0.1.0"
description = "ML-based emotion classification system for text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3",
  "matplotlib>=3.7", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0",
]

[project.optional-dependencies]
transformer = ["torch>=2.1", "transformers>=4.38", "datasets>=2.18", "accelerate>=0.27"]
dev = ["pytest>=7.4"]

[project.scripts]
emotion-train = "emotion_clf.train:main"
emotion-predict = "emotion_clf.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
